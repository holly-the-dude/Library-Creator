# Start Wiki if available
- name: see if wiki is there if not dont start
  shell: |
    test -f /Library/wiki/wiki.xml && echo exist || echo absent
  register: wiki_exist


- name: start wiki block
  when: '"exist" not in wiki_exist.stdout'
  block:
  - name: send message to display
    vars:
      color: '#FF0000'
      message: "Wiki Folder<br>or<br>files missing"
      border: 'border: 1px solid #FFFFFF'
    uri:
      url: "http://127.0.0.1:6901/upload-text"
      method: POST
      body: >
        html_data=<span style="color:{{ color }}; {{ border }};">{{ message }}</span>'
      body_format: raw
      status_code:
        - -1
        - 200
        - 500
    register: sendmessage
    become: true

- name: start wiki block
  when: '"exist" in wiki_exist.stdout'
  block:
  - name: send start message to display
    vars:
      color: '#FFd908'
      message: "Starting Wiki"
      border: 'border: 1px solid #FFFFFF'
    uri:
      url: "http://127.0.0.1:6901/upload-text"
      method: POST
      body: >
        html_data=<span style="color:{{ color }}; {{ border }};">{{ message }}</span>'
      body_format: raw
      status_code:
        - -1
        - 200
        - 500
    register: sendmessage
    become: true
  - name: see if wiki container is running
    shell: |
      podman ps |grep wiki >/dev/null && echo Running || echo Stopped
    register: wiki
    become: true

  - debug: var=wiki

  - name: start wiki container
    when: '"Stopped" in wiki.stdout'
    shell: |
      podman run -d --name wiki --ip 10.88.0.200 --privileged \
      --restart=always --replace \
      -v /Library/wiki:/wiki -p 6902:6902 \
      localhost/wiki /bin/sh -c \
      "kiwix-serve -v -p 6902 --nodatealiases --library /wiki/wiki.xml"
    register: startwiki
    become: true

  - name: show startup of wiki
    when: '"Stopped" in wiki.stdout'
    debug: var=startwiki.stdout_lines

  - name: verify wiki started
    shell: |
      sleep 15
      curl -s localhost:6902|grep Wikipedia -c
    register: wikiverify



  - name: send message to display
    when: '"1" in wikiverify.stdout'
    vars:
      color: yellow # or use #FFFFFF
      message: "Wiki Started"
      border: 'border: 1px solid #FFFFFF'
    uri:
      url: "http://127.0.0.1:6901/upload-text"
      method: POST
      body: >
        html_data=<span style="color:{{ color }}; {{ border }};">{{ message }}</span>'
      body_format: raw
      status_code:
        - -1
        - 200
        - 500
    register: sendmessage
    become: true

  - name: send message to display
    when: '"1" not in wikiverify.stdout'
    vars:
      color: '#FF1010'
      message: "Wiki Failed to Start"
      border: 'border: 1px solid #FFFFFF'
    uri:
      url: "http://127.0.0.1:6901/upload-text"
      method: POST
      body: >
        html_data=<span style="color:{{ color }}; {{ border }};">{{ message }}</span>'
      body_format: raw
      status_code:
        - -1
        - 200
        - 500
    register: sendmessage
    become: true

  - debug: var=sendmessage

