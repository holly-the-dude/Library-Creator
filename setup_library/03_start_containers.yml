##############################
# Start Containers
##################
# update display container
- name: see if update_display container is running
  shell: |
    podman ps |grep update_display >/dev/null && echo Running || echo Stopped
  register: updatedisplayrunning
  become: true

- debug: var=updatedisplayrunning

- name: start display container
  when: '"Stopped" in updatedisplayrunning.stdout'
  shell: >
    podman run -d  --privileged  -p 6901:6901
    -v /dev/fb0:/dev/fb0 -v /dev/tty2:/dev/tty2
    -w /root localhost/update_display ./update_display.py;
    sleep 20

  register: startdisplay
  become: true

- name: show startup of containter
  when: '"Stopped" in updatedisplayrunning.stdout'
  debug: var=startdisplay.stdout_lines


# curl -X POST -d 'html_data=<span style="color:yellow;">
# Your text here<br>Another line here.</span>' \
# http://raspi:6901/upload-text

- name: send message to display
  vars:
    color: yellow # or use #FFFFFF
    message: "Display Container Started "
    border: 'border: 1px solid #FFFFFF'
  uri:
    url: "http://127.0.0.1:6901/upload-text"
    method: POST
    body: >
      html_data=<span style="color:{{ color }}; {{ border }};">{{ message }}</span>'
    body_format: raw
    status_code:
      - -1
      - 200
      - 500
  register: sendmessage
  become: true

- debug: var=sendmessage

