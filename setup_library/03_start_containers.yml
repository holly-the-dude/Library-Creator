# Start Webserver if available
- name: see if webserver is there if not dont start
  shell: |
    test -d /Library/library && echo exist || echo absent
  register: www_exist


- name: start webserver block
  when: '"exist" not in www_exist.stdout'
  block:
  - name: send message to display
    vars:
      color: '#FFa0a0'
      message: "library Folder directory<br>is missing<br>shutdown <br>put files there"
      border: 'border: 1px solid #FFFFFF'
    uri:
      url: "http://127.0.0.1:6901/upload-text"
      method: POST
      body: >
        html_data=<span style="color:{{ color }}; {{ border }};">{{ message }}</span>'
      body_format: raw
      status_code:
        - -1
        - 200
        - 500
    register: sendmessage
    become: true

- name: start www block
  when: '"exist" in www_exist.stdout'
  block:
  - name: send start message to display
    vars:
      color: '#FFd908'
      message: "Starting Webserver"
      border: 'border: 1px solid #FFFFFF'
    uri:
      url: "http://127.0.0.1:6901/upload-text"
      method: POST
      body: >
        html_data=<span style="color:{{ color }}; {{ border }};">{{ message }}</span>'
      body_format: raw
      status_code:
        - -1
        - 200
        - 500
    register: sendmessage
    become: true
  - name: see if www container is running
    shell: |
      podman ps |grep webserver >/dev/null && echo Running || echo Stopped
    register: www
    become: true

  - debug: var=www

  - name: start www container
    when: '"Stopped" in www.stdout'
    shell: |
      podman run -d -v /Library:/library \
      -p 80:80 \
      --ip 10.88.0.201  --privileged  \
      localhost/webserver /bin/sh -c '/usr/bin/python3 /root/library.py;sleep infinity'
      sleep 30
      nohup /usr/local/bin/library_shutdown.py &
    register: startwww
    become: true

  - name: show startup of www
    when: '"Stopped" in www.stdout'
    debug: var=startwww.stdout_lines
#################################################
  - name: verify www started just index
    shell: |
      curl -s localhost|grep 'Library Index' -c
    register: wwwindex
    ignore_errors: true
    become: true
    until: '"1" in wwwindex.stdout'
