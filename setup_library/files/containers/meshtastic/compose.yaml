services:
  meshtastic:
    image: localhost/meshtastic:latest
    container_name: meshtastic
    build:
      context: .
      dockerfile: Containerfile
      args:
        BASE_IMAGE: "${BASE_IMAGE:-localhost/rasbase_master:latest}"
    restart: unless-stopped
    ports:
      - "8086:8086"
    devices:
      - "${MESHTASTIC_DEVICE:-/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0}:/dev/meshtastic:rwm"
    environment:
      SERIAL_DEVICE: /dev/meshtastic
      DATA_DIR: /var/lib/meshtastic
      DISCOVERY_SECONDS: "${DISCOVERY_SECONDS:-60}"
      AUTO_FLASH: "${AUTO_FLASH:-1}"
    volumes:
      - "${MESHTASTIC_DIR:-/Library/meshtastic}:/var/lib/meshtastic:Z"
