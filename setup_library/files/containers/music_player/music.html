  LOCAL MUSIC PLAYER — maintenance map
  This self-contained page embeds a compiled Svelte component, font, and wheel
  texture so it works offline. Generated helpers retain their original short
  names; edit the named customization points below rather than renaming runtime
  symbols or generated ctx[] indexes / dirty-bit masks.

  Page shell: library status, rescan, and playback errors outside Shadow DOM.
  PLAYER_SKIN_STYLES: purple appearance; classic uses the original component CSS.
  Pe / Ds / _s / Cs / ie: defaults, validation, storage, and settings store.
  xh / gn: settings menu rows and screen definitions.
  localFolderItems / nn: folder navigation and playback queue membership.
  yr / gr / bindLibraryControls: fetch, store, and rescan the local library.
  Ir / Sr / Tr: audio channels, playback queue, and reactive player state.
  i1: connects menu, wheel, backlight, volume, and audio lifecycle.
  a1: custom-element wrapper; applies saved skin and cleans up subscriptions.

  The purple design follows the supplied reference image. It is drawn
  with CSS; no local filesystem image URL or internet asset is needed at runtime.
  See README.md for behavior, editing guidance, and validation commands.
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library Music</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(130% 130% at 50% 0%, #2a2a2e 0%, #0d0d0f 60%, #000 100%);
    color: #e8e8ea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
    box-sizing: border-box;
    gap: 22px;
  }
  .stage {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: center;
  }
  library-music-player { width: 100%; }
  .caption {
    max-width: 440px;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
    color: #a8a8ad;
  }
  .caption b { color: #d8d8dc; font-weight: 600; }
  .hint {
    font-size: 12px;
    color: #7a7a80;
    text-align: center;
    max-width: 440px;
  }
  a { color: #fa586a; text-decoration: none; }
  a:hover { text-decoration: underline; }
  #rescan { margin-top: 12px; padding: 8px 14px; border-radius: 6px;
    border: 1px solid #666; background: #29292d; color: #eee; cursor: pointer; }
  #rescan:disabled { opacity: .65; cursor: wait; }
  #rescan:focus-visible { outline: 2px solid #f4ce7c; outline-offset: 3px; }
  #playback-error { color: #ffb3b3; }
</style>

</head>
<body>
  <div class="stage">
    <library-music-player></library-music-player>
  </div>
  <div class="caption">
    <b>Click wheel:</b> drag around the ring to scroll · press the
    center button to select · <b>MENU</b> goes back · the
    bottom button plays / pauses.
  </div>
  <div class="hint">
    <span id="library-status" role="status">Loading your music library…</span><br>
    <button type="button" id="rescan" disabled>Rescan music folder</button>
    <p id="playback-error" role="alert"></p>
    Full songs from your music folder. No internet connection needed.
  </div>

  <script>
    window.addEventListener('local-playback-error', (event) => {
      document.getElementById('playback-error').textContent = event.detail;
    });
  </script>
