worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # PMTiles MIME type
    types {
        application/vnd.pmtiles pmtiles;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression for text-based map assets (styles, fonts metadata)
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;

        # Serve the web viewer from the image
        root /var/www/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # PMTiles file listing (JSON) for auto-discovery
        location = /pmtiles/ {
            alias /storage/maps/pmtiles/;
            autoindex on;
            autoindex_format json;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Content-Type application/json;
        }

        # PMTiles files - enable range requests (critical for PMTiles)
        location /pmtiles/ {
            alias /storage/maps/pmtiles/;

            # Enable byte-range requests (PMTiles needs this)
            add_header Accept-Ranges bytes always;

            # CORS headers for MapLibre GL JS clients
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length" always;

            # Cache control - PMTiles are immutable once written
            add_header Cache-Control "public, max-age=86400" always;

            # Handle OPTIONS preflight for CORS
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Base map assets (fonts, sprites, styles)
        location /basemaps-assets/ {
            alias /storage/maps/basemaps-assets/;

            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Styles JSON
        location /styles/ {
            alias /storage/maps/styles/;

            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type application/json;
        }

        # Same-origin proxy to GraphHopper so the browser needs no CORS and the
        # routing engine is never exposed directly. The "graphhopper" hostname
        # resolves to the routing container on the shared compose network.
        # compose depends_on ensures GraphHopper is created before the web
        # server, so this upstream name resolves at nginx startup.
        location = /api/route {
            # No variables in proxy_pass -> nginx resolves "graphhopper" once at
            # startup (compose depends_on guarantees it exists) and forwards the
            # request's query string automatically. Using a variable here would
            # require a resolver and cause 502s.
            proxy_pass http://graphhopper:8989/route;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Serve index.html for root and unknown paths
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
