name: Library USB Downloader Linux installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: Linux installers (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test in Debian 12
        uses: docker/build-push-action@v6
        with:
          context: setup_library/files/data_downloader_cross_platform
          file: setup_library/files/data_downloader_cross_platform/packaging/linux/Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=linux-installers
          push: false
      - uses: actions/upload-artifact@v4
        with:
          name: library-usb-downloader-linux-${{ matrix.arch }}
          path: linux-installers/
          if-no-files-found: error
